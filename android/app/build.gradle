apply plugin: 'com.android.application'

android {
    namespace 'com.sketchymaze.doodle'
    compileSdk 34
    // NDK r27+ defaults its linker to 16 KB page-aligned ELF segments,
    // which recent Android versions/devices require for native libraries.
    // Older NDKs (this project used 26.3.11579264 until this was caught)
    // produce libraries that fail that check -- see the "16 KB page size"
    // entry in the README's Troubleshooting section for how this was
    // diagnosed. build-native-libs.sh uses whatever $ANDROID_NDK_HOME
    // points at, so keep that in sync with this if you change it.
    ndkVersion "30.0.16138531"

    defaultConfig {
        applicationId "com.sketchymaze.doodle"
        minSdkVersion 21
        targetSdkVersion 34

        // Keep in sync with pkg/branding/branding.go's Version constant.
        versionCode 1
        versionName "0.15.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            // Without a signingConfig, assembleRelease produces an
            // app-release-unsigned.apk that Android refuses to install at
            // all (even for local sideloading, not just the Play Store).
            // `signingConfigs.debug` is predefined by the Android Gradle
            // Plugin itself (it points at the auto-generated
            // ~/.android/debug.keystore), so this makes `make build`/
            // `make install` produce an installable app-release.apk for
            // local testing with zero setup. Replace this with a real
            // signingConfig (see README.md's "Signing a release build")
            // before distributing a release build anywhere.
            signingConfig signingConfigs.debug
        }
    }

    // The Go+cgo build (see ../scripts/build-native-libs.sh) drops its shared
    // libraries straight into src/main/jniLibs/<abi>/*.so -- Gradle just needs
    // to package whatever it finds there. There is no C/C++ source for Gradle
    // itself to compile, so no externalNativeBuild/CMake block is needed.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        // false (confusingly, since AGP's default is *already* false --
        // this makes it explicit) stores native libraries uncompressed in
        // the APK, which is what lets the OS mmap() them directly at
        // runtime instead of extracting them to disk at install time --
        // "legacy" packaging (true) means the old pre-API-23 compressed/
        // extract-at-install behavior. This originally said `true` here
        // under the mistaken assumption that it meant "don't compress";
        // it's the opposite. Also a prerequisite for 16 KB page alignment
        // to mean anything at all: a compressed .so's on-disk position
        // inside the APK zip isn't meaningful to align in the first place.
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
}
